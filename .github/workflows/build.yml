name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release with this version tag (for example v1.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests on Windows
        run: npm test
      - name: Build installer and portable exe
        run: npm run dist:win
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath 'release/win-unpacked/Billforce.exe' -ArgumentList "--smoke-test=$out" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Billforce-Windows-x64
          path: |
            release/Billforce-Setup-*.exe
            release/Billforce-Portable-*.exe
          if-no-files-found: error
      - name: Check the release tag matches the version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match package.json version $version" }
          if (-not (Test-Path "release-notes/$env:TAG.md")) { throw "release-notes/$env:TAG.md is missing" }
      # A tag push publishes; so does "Run workflow" with a release tag (the release action then creates the tag on this commit).
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Billforce ${{ inputs.release_tag || github.ref_name }}
          # Plain-language notes for shop owners: release-notes/<tag>.md
          body_path: release-notes/${{ inputs.release_tag || github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            release/Billforce-Setup-*.exe
            release/Billforce-Portable-*.exe
